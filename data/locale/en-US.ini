Help.Body="**What I can do**\n- Read the OBS state and log, find the cause and explain it\n- Search the web for known issues and show the sources\n- Propose changes to OBS settings. I show the values before and after and apply them only when you approve. Applied proposals can be undone\n- Add a noise suppression, gain, compressor or crop/pad filter, an application audio capture source or a browser source, with your approval\n- Explain step by step how to fix things outside OBS, such as Windows settings or drivers\n\n**What I cannot do**\n- Delete scenes, sources or filters. I suggest hiding, disabling or muting instead\n- Start or stop streaming, recording, the replay buffer or the virtual camera\n- Operate anything outside OBS\n- Save the conversation\n- Change output and video settings while streaming, recording, the replay buffer or the virtual camera is active\n- Answer topics unrelated to OBS and streaming\n\n**Example questions**\n- My game capture shows a black screen\n- Viewers say my voice is doubled\n- My stream stutters. Please find the cause\n\n**Commands**\n- /help: show this guide\n- /compact: summarize the conversation so far and continue\n- /clear: clear the conversation and start over"
