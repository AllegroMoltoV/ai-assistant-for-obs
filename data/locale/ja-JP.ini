Help.Body="**できること**\n- OBSの状態とログを読んで、原因を調べて説明します\n- Webで既知の問題を調べ、出典を示します\n- OBSの中の設定の変更を提案します。変更の前と後の値を示し、承認したときだけ適用します。適用した提案は元に戻せます\n- ノイズ抑制・ゲイン・コンプレッサー・クロップ/パッドのフィルタと、アプリケーション音声キャプチャ・ブラウザソースを、承認を得て追加します\n- Windowsの設定やドライバーなど、OBSの外の直し方を手順で案内します\n\n**できないこと**\n- シーン・ソース・フィルタの削除。代わりに非表示・無効・ミュートを提案します\n- 配信・録画・リプレイバッファ・仮想カメラの開始と停止\n- OBSの外の操作\n- 会話の保存\n- 配信・録画・リプレイバッファ・仮想カメラの動作中の、出力と映像の設定の変更\n- OBSと配信に関係ない話題への回答\n\n**質問の例**\n- ゲームの画面が真っ黒で映りません\n- 声が二重に聞こえると言われました\n- 配信がカクつくので原因を調べてください\n\n**コマンド**\n- /help: この案内を出します\n- /compact: ここまでの会話を要約して続けます\n- /clear: 会話を消して新しく始めます"
