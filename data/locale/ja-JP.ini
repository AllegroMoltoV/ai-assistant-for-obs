Help.Body="**できること**\n- OBSの状態とログを読んで、原因を調べて説明します\n- Webで既知の問題を調べ、出典を示します\n- OBSの中の設定を変える提案をします。変える前と後の値を見せ、承認したときだけ変えます。適用した変更は元に戻せます\n- ノイズ抑制・ゲイン・コンプレッサー・クロップのフィルターと、アプリケーション音声キャプチャ・ブラウザソースを、承認を得て追加します\n- Windowsの設定やドライバーなど、OBSの外の直し方を手順で案内します\n\n**できないこと**\n- シーン・ソース・フィルターの削除 (代わりに非表示・無効・ミュートを提案します)\n- 配信・録画の開始と停止\n- OBSの外の操作\n- 会話の保存\n- 配信中・録画中の出力の設定の変更\n\n**質問の例**\n- ゲームの画面が真っ黒で映りません\n- 声が二重に聞こえると言われました\n- 配信がカクつくので原因を調べてください\n\n**コマンド**\n- /help: この案内を出します\n- /compact: ここまでの会話を要約して続けます\n- /clear: 会話を消して新しく始めます"
